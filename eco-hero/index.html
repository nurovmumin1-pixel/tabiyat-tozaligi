<!doctype html>
<html lang="uz">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#16A34A">
    <title>ECO HERO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="onboarding" class="overlay hidden">
        <div class="modal">
            <div class="logo">🌱</div>
            <h1>ECO HERO</h1>
            <p data-i18n="welcome">Boshlash uchun ma'lumotlaringizni kiriting</p><label data-i18n="name">Ism</label><input id="regName" class="input" autocomplete="name" maxlength="40" placeholder="Ismingiz"><label data-i18n="phone">Telefon raqami</label><input id="regPhone"
                class="input" inputmode="tel" autocomplete="tel" maxlength="17" placeholder="+998 XX XXX XX XX"><label data-i18n="language">Til</label><select id="regLang" class="input"><option value="uz">O'zbekcha</option><option value="ru">Русский</option><option value="kk">Қазақша</option><option value="en">English</option><option value="tg">Тоҷикӣ</option></select>
            <button class="btn primary full" onclick="registerUser()" data-i18n="continue">Davom etish →</button>
        </div>
    </div>
    <header><button class="menu" onclick="toggleSide()">☰</button>
        <div class="brand" onclick="go('home')"><b>🌱 ECO HERO</b><small>Clean • Earn • Grow</small></div><button class="coins" onclick="go('wallet')">🪙 <span id="coinTop">0</span></button></header>
    <aside id="side">
        <div class="user-mini">
            <div id="miniAvatar" class="avatar">👤</div>
            <div><b id="miniName">Eco Hero</b><small id="miniLevel">Yangi ishtirokchi</small></div>
        </div><button onclick="go('home')">🏠 <span data-i18n="home">Bosh sahifa</span></button><button onclick="go('map')">🗺️ <span data-i18n="map">Xarita</span></button><button onclick="go('rank')">🏆 <span data-i18n="rank">Reyting</span></button>
        <button onclick="go('rewards')">🎁 <span data-i18n="rewards">Sovg'alar</span></button><button onclick="go('wallet')">🪙 EcoWallet</button><button onclick="go('profile')">👤 <span data-i18n="profile">Profil</span></button><button onclick="go('settings')">⚙️ <span data-i18n="settings">Sozlamalar</span></button></aside>
    <main id="app"></main>
    <nav class="bottom"><button onclick="go('home')">🏠<small>Bosh</small></button><button onclick="go('map')">🗺️<small>Xarita</small></button><button class="plus" onclick="go('task')">＋<small>Topshiriq</small></button><button onclick="go('rewards')">🎁<small>Sovg'a</small></button>
        <button onclick="go('profile')">👤<small>Profil</small></button>
    </nav>
    <div id="toast"></div>
    <script src="js/app.js"></script>
</body>

</html>
